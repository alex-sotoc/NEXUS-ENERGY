name: nexus_energy
description: NEXUS ENERGY - Sistema inteligente de monitoreo y control de energia
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Comunicacion HTTP con FastAPI
  http: ^1.2.2

  # Graficas de consumo
  fl_chart: ^0.69.0

  # Guardado local de sesion y preferencias
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/